name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "=== BẮT ĐẦU TRIỂN KHAI TRÊN VPS ==="
            
            # Di chuyển vào thư mục dự án
            cd /var/www/clothing-rental || { echo "Không tìm thấy thư mục dự án!"; exit 1; }
            
            # Kéo mã nguồn mới nhất từ GitHub
            echo "Đang kéo code mới..."
            git pull
            
            # Khởi chạy Docker Compose build lại ứng dụng
            echo "Đang khởi chạy Docker Compose..."
            docker compose down
            docker compose up -d --build
            
            # Dọn dẹp các images không sử dụng để tiết kiệm dung lượng đĩa
            echo "Đang dọn dẹp hệ thống Docker..."
            docker image prune -f

            # Thực hiện kiểm tra, gia hạn SSL và lưu log chẩn đoán
            echo "=== GIA HẠN CHỨNG CHỈ SSL VÀ THIẾT LẬP CRON JOB ==="
            DIAG_FILE="/tmp/ssl_diag.txt"
            {
              echo "=== 1. HỆ ĐIỀU HÀNH & USER ==="
              whoami
              id
              cat /etc/os-release 2>/dev/null | grep PRETTY_NAME
              
              echo "=== 2. TÌM KIẾM CERTBOT ==="
              which certbot 2>&1
              whereis certbot 2>&1
              find /usr /snap /opt -name certbot 2>/dev/null | head -n 5

              echo "=== 3. CHỨNG CHỈ HIỆN CÓ ==="
              certbot certificates 2>&1 || sudo certbot certificates 2>&1

              echo "=== 4. THỰC HIỆN GIA HẠN ==="
              # Thử renew chuẩn
              certbot renew --non-interactive 2>&1 || sudo certbot renew --non-interactive 2>&1 || \
              certbot renew --force-renewal 2>&1 || sudo certbot renew --force-renewal 2>&1 || \
              /snap/bin/certbot renew --non-interactive 2>&1 || sudo /snap/bin/certbot renew --non-interactive 2>&1

              echo "=== 5. NGINX TEST & RELOAD ==="
              nginx -t 2>&1 || sudo nginx -t 2>&1
              systemctl reload nginx 2>&1 || sudo systemctl reload nginx 2>&1 || nginx -s reload 2>&1 || sudo nginx -s reload 2>&1

              echo "=== 6. THIẾT LẬP CRON JOB ĐỊNH KỲ ==="
              CERT_CMD=$(which certbot 2>/dev/null || which /snap/bin/certbot 2>/dev/null || echo "/usr/bin/certbot")
              CRON_LINE="0 3 * * * root $CERT_CMD renew --quiet --post-hook 'systemctl reload nginx || nginx -s reload' > /dev/null 2>&1"
              if [ -d "/etc/cron.d" ]; then
                echo "$CRON_LINE" | sudo tee /etc/cron.d/certbot-auto-renew > /dev/null 2>&1 || echo "$CRON_LINE" > /etc/cron.d/certbot-auto-renew 2>/dev/null || true
                sudo chmod 644 /etc/cron.d/certbot-auto-renew 2>/dev/null || chmod 644 /etc/cron.d/certbot-auto-renew 2>/dev/null || true
                echo "Đã ghi file /etc/cron.d/certbot-auto-renew"
              fi
              systemctl enable --now certbot.timer 2>/dev/null || sudo systemctl enable --now certbot.timer 2>/dev/null || true

              echo "=== HOÀN TẤT ==="
            } > "$DIAG_FILE" 2>&1

            # In ra màn hình console của GitHub Actions
            cat "$DIAG_FILE"

            # Copy vào container để có thể đọc qua URL /uploads/ssl_diag.txt
            docker cp "$DIAG_FILE" clothing-rental-web:/app/wwwroot/uploads/ssl_diag.txt 2>/dev/null || true
            
            echo "=== TRIỂN KHAI VÀ GIA HẠN HOÀN TẤT ==="
