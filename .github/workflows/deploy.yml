name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "=== BẮT ĐẦU TRIỂN KHAI TRÊN VPS ==="
            
            # Di chuyển vào thư mục dự án
            cd /var/www/clothing-rental || { echo "Không tìm thấy thư mục dự án!"; exit 1; }
            
            # Kéo mã nguồn mới nhất từ GitHub
            echo "Đang kéo code mới..."
            git pull
            
            # Khởi chạy Docker Compose build lại ứng dụng
            echo "Đang khởi chạy Docker Compose..."
            docker compose down
            docker compose up -d --build
            
            # Dọn dẹp các images không sử dụng để tiết kiệm dung lượng đĩa
            echo "Đang dọn dẹp hệ thống Docker..."
            docker image prune -f

            # Thực hiện kiểm tra, gia hạn SSL và lưu log chẩn đoán
            echo "=== GIA HẠN CHỨNG CHỈ SSL VÀ THIẾT LẬP CRON JOB ==="
            DIAG_FILE="/tmp/ssl_diag.txt"
            {
              echo "=== 1. KIỂM TRA SUDO VỚI MẬT KHẨU ==="
              echo "123123@" | sudo -S whoami 2>&1

              echo "=== 2. THỰC HIỆN GIA HẠN SSL BẰNG CERTBOT (SUDO) ==="
              echo "123123@" | sudo -S certbot renew 2>&1

              echo "=== 3. CHỨNG CHỈ SAU KHI GIA HẠN ==="
              echo "123123@" | sudo -S certbot certificates 2>&1

              echo "=== 4. RELOAD NGINX ==="
              echo "123123@" | sudo -S systemctl reload nginx 2>&1

              echo "=== 5. THIẾT LẬP CRON JOB VÀ SYSTEMD TIMER TỰ ĐỘNG GIA HẠN ==="
              echo "123123@" | sudo -S bash -c "echo '0 3 * * * root /usr/bin/certbot renew --quiet --post-hook \"systemctl reload nginx\"' > /etc/cron.d/certbot-auto-renew && chmod 644 /etc/cron.d/certbot-auto-renew" 2>&1
              echo "123123@" | sudo -S systemctl enable --now certbot.timer 2>&1

              echo "=== HOÀN TẤT GIA HẠN ==="
            } > "$DIAG_FILE" 2>&1

            # In ra màn hình console của GitHub Actions
            cat "$DIAG_FILE"

            # Copy vào container để có thể đọc qua URL /uploads/ssl_diag.txt
            docker cp "$DIAG_FILE" clothing-rental-web:/app/wwwroot/uploads/ssl_diag.txt 2>/dev/null || true
            
            echo "=== TRIỂN KHAI VÀ GIA HẠN HOÀN TẤT ==="
